name: PredicTEE CI & Contract Verification

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Node & Python dependencies
        run: |
          npm install
          pip install -r packages/agent/requirements.txt

      - name: Run NEAR Smart Contract & Agent Test Suites
        run: npm test

      - name: Run Headless End-to-End Verification
        run: npm run verify:headless

      - name: Build Frontend Production Bundle
        run: npm run build:frontend
